<div class="app-container overflow-hidden relative min-h-[100dvh]">
  <router-outlet></router-outlet>
  <app-toast></app-toast>

  <!-- AI Coach Global Drawer -->
  <app-ai-coach-drawer></app-ai-coach-drawer>

  <!-- Floating Action Button for AI Coach -->
  <button cdkDrag cdkDragBoundary=".app-container" (click)="uiState.toggleAiDrawer()"
          class="fixed bottom-6 right-6 h-14 w-14 rounded-full bg-[#151921] border border-zinc-700 shadow-[0_0_20px_rgba(204,255,0,0.15)] flex items-center justify-center z-50 hover:scale-110 hover:border-[#CCFF00] transition-all group focus:outline-none focus:ring-2 focus:ring-[#CCFF00] focus:ring-offset-2 focus:ring-offset-[#0B0E14] cursor-move">
      <mat-icon class="text-[#CCFF00] group-hover:animate-pulse">smart_toy</mat-icon>
      <!-- Notification Dot indicator -->
      <span class="absolute top-0 right-0 block h-3 w-3 rounded-full bg-[#CCFF00] ring-2 ring-[#151921]"></span>
  </button>
</div>
