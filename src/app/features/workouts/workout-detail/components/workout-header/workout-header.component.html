<div class="bg-[#0B0E14] sticky top-0 z-50 border-b border-zinc-800 pb-4 pt-4 px-4 shadow-xl">
    <div class="flex justify-between items-center mb-4">
        <button (click)="cancel.emit()" class="text-zinc-400 hover:text-zinc-200 bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg font-bold text-[10px] uppercase flex items-center gap-1 transition-colors border border-zinc-700">
            <mat-icon class="text-sm">close</mat-icon> Cancelar
        </button>
        <div class="flex flex-col items-center">
            <span class="text-[10px] uppercase tracking-widest text-[#CCFF00] font-bold">Tiempo Transcurrido</span>
            <span class="text-3xl font-mono font-bold text-white">{{ sessionTimeFormatted() }}</span>
        </div>
        <button (click)="save.emit()" class="bg-[#CCFF00] text-black hover:bg-[#bce600] px-4 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all shadow-[0_0_10px_rgba(204,255,0,0.3)]">
            Guardar
        </button>
    </div>
    
    <!-- Progress Bar -->
    <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden" [ngClass]="{'animate-pulse': timerProgress() >= 100}">
        <div class="h-full bg-[#CCFF00] transition-all duration-1000 ease-linear shadow-[0_0_10px_rgba(204,255,0,0.5)]"
             [style.width.%]="timerProgress()"></div>
    </div>
</div>
