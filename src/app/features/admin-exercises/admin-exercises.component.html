<div class="min-h-screen bg-background text-text-main p-4 md:p-6 pb-24 relative overflow-x-hidden animate-fadeIn">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Header & Action Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-surface p-5 rounded-2xl border border-zinc-800 shadow-xl">
      <div class="flex items-center gap-4">
        <button (click)="goBack()" class="text-text-muted hover:text-text-main transition-colors p-2 bg-zinc-900 rounded-lg border border-zinc-700 hover:border-zinc-500 flex items-center justify-center">
          <span class="text-xs font-bold uppercase tracking-widest">Volver</span>
        </button>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-text-main leading-none">Catálogo</h1>
          <p class="text-xs text-text-muted uppercase tracking-widest mt-1">{{ store.filteredExercises().length }} ejercicios de {{ store.exercisesList().length }}</p>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
        <!-- Search -->
        <div class="relative w-full sm:w-64">
          <label for="searchQuery" class="sr-only">Buscar por nombre</label>
          <input id="searchQuery" type="search" placeholder="Buscar por nombre..."
            [ngModel]="store.searchQuery()" (ngModelChange)="store.searchQuery.set($event)"
            class="w-full bg-background border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-text-main focus:outline-none focus:border-primary transition-colors shadow-inner">
        </div>

        <!-- Filters -->
        <label for="filterMuscle" class="sr-only">Músculo</label>
        <select id="filterMuscle" [ngModel]="store.filterMuscle()" (ngModelChange)="store.filterMuscle.set($event)"
          class="w-full sm:w-auto bg-background border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-text-main focus:outline-none focus:border-primary appearance-none cursor-pointer">
          <option value="">Músculo (Todos)</option>
          @for (m of muscleGroups; track m) {
            <option [value]="m">{{ m | titlecase }}</option>
          }
        </select>

        <label for="filterDiscipline" class="sr-only">Disciplina</label>
        <select id="filterDiscipline" [ngModel]="store.filterDiscipline()" (ngModelChange)="store.filterDiscipline.set($event)"
          class="w-full sm:w-auto bg-background border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-text-main focus:outline-none focus:border-primary appearance-none cursor-pointer">
          <option value="">Disciplina (Todas)</option>
          <option value="gym">Gym</option>
          <option value="calisthenics">Calisthenics</option>
          <option value="boxing">Boxing</option>
        </select>

        <button (click)="openCreate()"
          class="w-full sm:w-auto px-6 py-2.5 bg-primary text-black font-bold text-sm tracking-wider uppercase rounded-xl transition-all shadow-[0_0_15px_rgba(204,255,0,0.2)] whitespace-nowrap active:scale-95">
          + Nuevo
        </button>
      </div>
    </div>

    <!-- Dumb Table Component -->
    <app-exercise-table 
      [data]="store.filteredExercises()"
      (edit)="openEdit($event)">
    </app-exercise-table>
    
    <!-- Empty State Handle -->
    @if (store.filteredExercises().length === 0 && store.exercisesList().length > 0) {
      <div class="col-span-full py-20 flex flex-col items-center justify-center text-text-muted bg-surface rounded-2xl border border-zinc-800 border-dashed">
        <app-ui-icon name="search" customClass="opacity-50 mb-4" [size]="48"></app-ui-icon>
        <p class="font-medium tracking-wide">No se encontraron ejercicios que coincidan con los filtros.</p>
        <button (click)="store.searchQuery.set(''); store.filterMuscle.set(''); store.filterDiscipline.set('')" class="mt-4 text-primary hover:underline text-xs uppercase tracking-widest font-bold">Limpiar Filtros</button>
      </div>
    }
  </div>

  <!-- Dumb Form Component (Side Sheet) -->
  @if (store.isSideSheetOpen()) {
    <app-exercise-form
      [form]="exerciseForm"
      [isEditing]="store.editingExerciseId() !== null"
      [isSaving]="store.isSaving()"
      [equipmentRequired]="equipmentRequired"
      (close)="closeSideSheet()"
      (save)="onSubmit()"
      (toggleEq)="toggleEquipment($event)">
    </app-exercise-form>
  }
</div>
